version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zimsignal_postgres
    restart: always
    environment:
      POSTGRES_DB: zimsignal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: