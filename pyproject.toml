[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zimsignal-ai"
version = "1.3.0"
description = "Evidence-grounded agricultural intelligence and signal API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.1",
    "firecrawl-py==4.46.2",
    "httpx==0.28.1",
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.7",
    "langchain-postgres==0.0.19",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.12",
    "mcp==1.28.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "tenacity==9.1.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "psycopg2-binary==2.9.13",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-dotenv==0.5.2",
    "pytest-httpx==0.36.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "api*",
    "engine*",
    "evals*",
    "governance*",
    "ingestion*",
    "orchestration*",
    "prompts*",
    "retrieval*",
    "tools*",
]
